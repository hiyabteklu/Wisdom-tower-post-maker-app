name: Build Wisdom Tower Post Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Package release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          cp "$APK_PATH" Wisdom-Tower-Post-release.apk
          ls -lh Wisdom-Tower-Post-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wisdom-Tower-Post-RELEASE-APK
          path: Wisdom-Tower-Post-release.apk
          retention-days: 30
